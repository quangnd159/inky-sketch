name: Android release

on:
  push:
    tags: ["v0.3.0-alpha.1"]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_TAG: v0.3.0-alpha.1
      EXPECTED_VERSION: 0.3.0-alpha.1
      EXPECTED_PACKAGE: dev.einkstudio.poc
      APK_NAME: inky-sketch-0.3.0-alpha.1.apk
      INKY_SKETCH_KEYSTORE_PASSWORD: ${{ secrets.INKY_SKETCH_KEYSTORE_PASSWORD }}
      INKY_SKETCH_KEY_ALIAS: ${{ secrets.INKY_SKETCH_KEY_ALIAS }}
      INKY_SKETCH_KEY_PASSWORD: ${{ secrets.INKY_SKETCH_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v5
      - uses: gradle/actions/setup-gradle@v5

      - name: Validate tag and signing secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.INKY_SKETCH_KEYSTORE_BASE64 }}
        run: |
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$INKY_SKETCH_KEYSTORE_PASSWORD"
          test -n "$INKY_SKETCH_KEY_ALIAS"
          test -n "$INKY_SKETCH_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inky-sketch-release.jks"
          chmod 600 "$RUNNER_TEMP/inky-sketch-release.jks"
          echo "INKY_SKETCH_KEYSTORE_PATH=$RUNNER_TEMP/inky-sketch-release.jks" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed release
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Verify, name, and checksum the APK
        shell: bash
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          source_apk="app/build/outputs/apk/release/app-release.apk"
          output_apk="app/build/outputs/apk/release/$APK_NAME"
          "$build_tools/apksigner" verify --verbose --print-certs "$source_apk"
          badging="$("$build_tools/aapt" dump badging "$source_apk")"
          printf '%s\n' "$badging"
          printf '%s\n' "$badging" | grep -F "package: name='$EXPECTED_PACKAGE'"
          printf '%s\n' "$badging" | grep -F "versionName='$EXPECTED_VERSION'"
          permissions="$("$build_tools/aapt" dump permissions "$source_apk")"
          printf '%s\n' "$permissions"
          if printf '%s\n' "$permissions" | grep -q '^uses-permission:'; then
            echo "The release APK must not request Android permissions." >&2
            exit 1
          fi
          cp "$source_apk" "$output_apk"
          cd app/build/outputs/apk/release
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"

      - uses: actions/upload-artifact@v5
        with:
          name: inky-sketch-${{ env.EXPECTED_VERSION }}
          path: |
            app/build/outputs/apk/release/${{ env.APK_NAME }}
            app/build/outputs/apk/release/${{ env.APK_NAME }}.sha256
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Inky Sketch is a tiny, offline drawing app tuned for monochrome e-ink tablets.

            This alpha includes six pressure-aware instruments (Fineliner, Fountain, Ballpoint, HB Pencil, Soft Pencil, and Marker), a crisp low-contrast-safe interface, functional layer controls, a true segment eraser, undo/redo, v1/v2 canvas migration, atomic autosave with last-good recovery, and permission-free PNG/native project export.

            The app requests no Android permissions and performs no runtime networking. Its legacy application ID remains `dev.einkstudio.poc`, preserving upgrades and app-private drawings from the original proof of concept.

            BOOX guidance: sketch in a fast refresh mode when desired, then switch to HD/highest-clarity mode and use Refresh for final inspection. Automated tests, lint, signature/package/version checks, and the zero-permission check pass in this release workflow. Physical-device behavior varies by BOOX firmware and model; this alpha does not claim completed validation on every device, so keep an exported `.inky` backup while evaluating it.
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "app/build/outputs/apk/release/$APK_NAME" \
            "app/build/outputs/apk/release/$APK_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Inky Sketch $GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES"
