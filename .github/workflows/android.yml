name: Android validation

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v5
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify Gradle wrapper version
        run: ./gradlew --version
      - name: Test, lint, and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Verify the APK requests no permissions
        shell: bash
        run: |
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          permissions="$($aapt_path dump permissions app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$permissions"
          if printf '%s\n' "$permissions" | grep -q '^uses-permission:'; then
            echo "The APK must not request Android permissions." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: inky-sketch-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
